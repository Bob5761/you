name: job

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r dep.txt
      - run: python run.py
      - uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: |
            finds.txt
            report.md
